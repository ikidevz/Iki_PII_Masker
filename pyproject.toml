[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iki-pii-masker"
version = "1.0.0"
description = "Production-grade PII masking CLI tool for data engineers and analysts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Iki", email = "ikigamidevs@gmail.com" }]
keywords = ["pii", "masking", "privacy", "data-engineering", "cli", "gdpr"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]

dependencies = [
    "rich>=13.0.0",
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "faker>=24.0.0",
    "cryptography>=41.0.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
    "duckdb>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

# ====================== CLI ENTRY POINTS ======================
[project.scripts]
pii_masker = "Iki_PII_Masker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/Iki_PII_Masker"]

[tool.hatch.build.targets.sdist]
include = ["src/Iki_PII_Masker", "README.md"]

# ====================== TOOL CONFIG ======================
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"